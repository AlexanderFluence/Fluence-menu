plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fluence.menu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fluence.menu'
        minSdk 21
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
