name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FluenceMenu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FluenceMenu-APK
          path: FluenceMenu.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Fluence Menu (última versión)
          body: Descarga FluenceMenu.apk y ábrelo en la radio para instalarlo.
          files: FluenceMenu.apk
          make_latest: true
